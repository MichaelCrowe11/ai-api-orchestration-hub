version: '3.8'

services:
  orchestration-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-orchestration-hub
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - HOST=0.0.0.0

      # API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}

      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_ENABLED=true

      # Cache Settings
      - CACHE_TTL=${CACHE_TTL:-3600}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}

      # Rate Limiting
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - RATE_LIMIT_TIME_WINDOW=${RATE_LIMIT_TIME_WINDOW:-60000}

      # Cost Management
      - ENABLE_COST_TRACKING=${ENABLE_COST_TRACKING:-true}
      - MAX_COST_PER_REQUEST=${MAX_COST_PER_REQUEST:-1.00}
      - DAILY_BUDGET_LIMIT=${DAILY_BUDGET_LIMIT:-100.00}

      # Monitoring
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}

      # Load Balancing
      - ENABLE_LOAD_BALANCING=${ENABLE_LOAD_BALANCING:-true}
      - ENABLE_FAILOVER=${ENABLE_FAILOVER:-true}
      - FAILOVER_RETRY_ATTEMPTS=${FAILOVER_RETRY_ATTEMPTS:-3}
      - FAILOVER_RETRY_DELAY=${FAILOVER_RETRY_DELAY:-1000}

      # Default Provider Settings
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-auto}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-auto}
      - DEFAULT_MAX_TOKENS=${DEFAULT_MAX_TOKENS:-1000}
      - DEFAULT_TEMPERATURE=${DEFAULT_TEMPERATURE:-0.7}

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - orchestration-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: ai-orchestration-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - orchestration-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  orchestration-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
